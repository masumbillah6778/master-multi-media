            <ul class="nav-links">

          </div>
          
          <div class="darkLight-searchBox">
            <div class="dark-light">
              <i class='bx bx-moon moon'></i>
              <i class='bx bx-sun sun'></i>
            </div>
            
            <div class="searchBox">
              <div class="searchToggle">
                <i class='bx bx-x cancel'></i>
                <i class='bx bx-search search'></i>
              </div>
              
              <div class="search-field">
                <input type="text" placeholder="Search...">
                <i class='bx bx-search'></i>
              </div>
            </div>
          </div>
        </div>
      </nav>
      
      <main>
        <div class="container">
          <section class="content">
            <div class="heading"> Music Lyrics </div>

            
            <div class="main-slide-box" id="scrollbar">
              <div class="lyrics-box">
                
                <div class="lyrics-box-content">
                  <div id="overlay"></div>
                  <div class="lyric-box">
                    <div class="lyrics"></div>
                  </div>
                
                  <div class="video-player-box">
                    <div class="video-player">
                      <table>
                        <tr>
                          <td rowspan="2" class="images"> <img src="https://masumbillah6778.github.io/images/music-thumbnail-10.jpg" alt="img">  </td>
                          <td class="name"> <a href="https://youtu.be/D5xf2hgG_nQ?si=0U3_QqayXjaS92c7" target="_blank"> আমার দিন গুলো সব </a> </td>
                        </tr>
                        <tr>
                          <td class="artist"> হাবিব ও ন্যান্সি  </td>
                        </tr>
                        <tr>
                          <td colspan="2" class="player">
                            <video controls loop controlslist="nodownload" controls="" _autoplay="" name="media" oncontextmenu="return false;">
                              <source src="https://masumbillah6778bd.github.io/music-lyrics/music/amar-din-gulo-sob-jai-hariye.mp3" type="audio/mpeg" />
                            </video>
                          </td>
                        </tr>
                      </table>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </section>
        </div>
      </main>






      <!-- ============================================= AOTU MUSIC ============================================= -->

        </marquee>
      </div>
