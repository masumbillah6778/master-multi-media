<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>তথ্য সংরক্ষণ ও ব্যবস্থাপনা সিস্টেম</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <h1>📋 তথ্য সংরক্ষণ ও ব্যবস্থাপনা সিস্টেম</h1>

    <p>
        আপনার তথ্য এক জায়গায় সংরক্ষণ করুন এবং অন্য পেজে সুন্দর টেবিলে দেখুন
    </p>

</header>


<!-- ================= NAV ================= -->

<nav class="nav no-print">

    <button
        class="active"
        onclick="showSection('dashboard',this)">
        🏠 Dashboard
    </button>

    <button
        onclick="showSection('formSection',this)">
        ➕ ফরম পূরণ
    </button>

    <button
        onclick="showSection('viewSection',this)">
        📋 View Table
    </button>

</nav>


<main class="container">


<!-- ===================================================== -->
<!-- ================= DASHBOARD ========================== -->
<!-- ===================================================== -->

<section
    id="dashboard"
    class="section active">

    <div class="card">

        <h2>🏠 Dashboard</h2>

        <div class="dashboard-grid">

            <div class="stat">

                <div
                    id="totalCount"
                    class="stat-number">
                    0
                </div>

                <div class="stat-title">
                    মোট তথ্য
                </div>

            </div>


            <div class="stat">

                <div
                    id="addCount"
                    class="stat-number">
                    0
                </div>

                <div class="stat-title">
                    যুক্ত
                </div>

            </div>


            <div class="stat">

                <div
                    id="removeCount"
                    class="stat-number">
                    0
                </div>

                <div class="stat-title">
                    অপসারণ
                </div>

            </div>

        </div>

    </div>

</section>


<!-- ===================================================== -->
<!-- ================= FORM =============================== -->
<!-- ===================================================== -->

<section
    id="formSection"
    class="section">

    <div class="card">

        <h2 id="formHeading">
            ➕ ফরম পূরণ
        </h2>


        <form id="dataForm">

            <div class="form-grid">


                <div class="field">

                    <label>
                        নাম
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="নাম লিখুন"
                        required>

                </div>


                <div class="field">

                    <label>
                        তারিখ
                    </label>

                    <input
                        id="date"
                        type="date"
                        required>

                </div>


                <div class="field">

                    <label>
                        বিস্তারিত
                    </label>

                    <textarea
                        id="details"
                        placeholder="বিস্তারিত লিখুন"
                        required></textarea>

                </div>


                <div class="field">

                    <label>
                        জনবল
                    </label>

                    <input
                        id="manpower"
                        type="text"
                        inputmode="numeric"
                        placeholder="জনবল লিখুন">

                </div>


                <div class="field">

                    <label>
                        যুক্ত / অপসারণ
                    </label>

                    <input
                        id="change"
                        type="text"
                        inputmode="text"
                        placeholder="যেমন: +5 অথবা -2">

                </div>

            </div>


            <div class="buttons">

                <button
                    class="btn btn-primary"
                    type="submit"
                    id="saveBtn">
                    💾 সংরক্ষণ
                </button>


                <button
                    class="btn btn-secondary"
                    type="button"
                    onclick="resetForm()">
                    ↻ নতুন ফর্ম
                </button>

            </div>

        </form>

    </div>

</section>


<!-- ===================================================== -->
<!-- ================= VIEW TABLE ========================= -->
<!-- ===================================================== -->

<section
    id="viewSection"
    class="section">

    <div class="card">

        <div class="no-print">

            <h2 id="tableTitle">
                📋 View Table
            </h2>

        </div>


        <!-- SEARCH -->

        <div
            class="search-area no-print"
            id="searchArea">

            <input
                id="search"
                class="search"
                type="search"
                placeholder="🔎 Search table...">

            <button
                class="btn btn-blue"
                onclick="printTable()">
                🖨 Print
            </button>

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table id="mainTable">

                <thead>

                    <tr>

                        <th>নং</th>

                        <th>নাম</th>

                        <th>তারিখ</th>

                        <th>বিস্তারিত</th>

                        <th>জনবল</th>

                        <th>যুক্ত /<br>অপসারণ</th>

                        <th class="no-print">
                            কার্যক্রম
                        </th>

                    </tr>

                </thead>


                <tbody id="tableBody">

                </tbody>

            </table>

        </div>

    </div>

</section>

</main>


<!-- ===================================================== -->
<!-- ================= EDIT MODAL ========================= -->
<!-- ===================================================== -->

<div
    id="editModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                ✏️ তথ্য Edit
            </h2>

            <button
                class="close"
                onclick="closeModal()">
                ×
            </button>

        </div>


        <form id="editForm">

            <input
                id="editId"
                type="hidden">


            <div class="field">

                <label>
                    নাম
                </label>

                <input
                    id="editName"
                    required>

            </div>

            <br>


            <div class="field">

                <label>
                    তারিখ
                </label>

                <input
                    id="editDate"
                    type="date"
                    required>

            </div>

            <br>


            <div class="field">

                <label>
                    বিস্তারিত
                </label>

                <textarea
                    id="editDetails"
                    required></textarea>

            </div>

            <br>


            <div class="field">

                <label>
                    জনবল
                </label>

                <input
                    id="editManpower">

            </div>

            <br>


            <div class="field">

                <label>
                    যুক্ত / অপসারণ
                </label>

                <input
                    id="editChange">

            </div>


            <div class="buttons">

                <button
                    class="btn btn-primary"
                    type="submit">
                    💾 পরিবর্তন সংরক্ষণ
                </button>

                <button
                    class="btn btn-secondary"
                    type="button"
                    onclick="closeModal()">
                    বাতিল
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ================= TOAST ================= -->

<div
    id="toast"
    class="toast">
</div>


<script type="module" src="script.js"></script>


</body>
</html>
